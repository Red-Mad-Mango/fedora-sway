# TOUCHPAD
input "type:touchpad" {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    dwt enabled
    
    #Use 'flat' for predictable, raw 1:1 tracking (removes weird acceleration jumps)
    accel_profile flat
    
    # Increase tracking speed (0.0 is default, 1.0 is max speed)
    pointer_accel 0.7

    # Fine-tune scroll speed if two-finger scrolling feels too fast or sluggish
    scroll_factor 0.7

    # Disable drag lock so lifting you finger instantly unselects text
    drag_lock disabled
}

# TOUCHPAD SWIPE GESTURES
bindgesture swipe:3:left workspace next
bindgesture swipe:3:right workspace prev

bindgesture swipe:3:up fullscreen toggle
bindgesture swipe:3:down floating toggle

bindgesture swipe:4:left move container to workspace prev
bindgesture swipe:4:right move container to workspace next

bindgesture swipe:4:up layout toggle split
bindgesture swipe:4:down layout tabbed
