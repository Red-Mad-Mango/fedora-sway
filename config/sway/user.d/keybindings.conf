# =========================================================================
# Noctalia Unified Inter-Process Communication (IPC) Configuration
# =========================================================================
set $ipc noctalia msg

# Panel & Overlay Toggles (Using Ctrl to avoid Sway core navigation conflicts)
bindsym $mod+d          exec $ipc panel-toggle launcher
bindsym $mod+Ctrl+s     exec $ipc panel-toggle control-center
bindsym $mod+comma      exec $ipc settings-toggle

# Hardware Audio Controls (Locked to work even if screen is locked)
bindsym --locked XF86AudioRaiseVolume exec $ipc volume-up
bindsym --locked XF86AudioLowerVolume exec $ipc volume-down
bindsym --locked XF86AudioMute        exec $ipc volume-mute

# Hardware Screen Brightness Controls
bindsym --locked XF86MonBrightnessUp   exec $ipc brightness-up
bindsym --locked XF86MonBrightnessDown exec $ipc brightness-down

# =========================================================================
# Noctalia Native Screenshot Ecosystem
# =========================================================================
# Print Screen: Opens Noctalia's interactive area & window utility with drawing tools
bindsym Print exec noctalia msg screenshot-region

# Mod + Print Screen: Instantly captures the entire screen & saves to file
bindsym $mod+Print exec noctalia msg screenshot-fullscreen

# =========================================================================
# wf-recorder 
# =========================================================================
bindsym $mod+r exec --no-startup-id pkill wf-recorder || wf-recorder -g "$(slurp)" -f ~/Videos/recording-$(date +'%Y%m%d-%H%M%S').mkv
