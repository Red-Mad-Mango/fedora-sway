# =========================================================================
# Noctalia Unified Inter-Process Communication (IPC) Configuration
# =========================================================================
set $ipc noctalia msg

# Panel & Overlay Toggles (Using Ctrl to avoid Sway core navigation conflicts)
bindsym $mod+a          exec $ipc panel-toggle launcher
bindsym $mod+Ctrl+s     exec $ipc panel-toggle control-center
bindsym $mod+comma      exec $ipc settings-toggle
bindsym $mod+Ctrl+w     exec $ipc panel-toggle wallpaper
bindsym $mod+Ctrl+b     exec $ipc panel-toggle clipboard
bindsym $mod+Ctrl+x     exec $ipc panel-toggle session

# Hardware Audio Controls (Locked to work even if screen is locked)
bindsym --locked XF86AudioRaiseVolume exec $ipc volume-up
bindsym --locked XF86AudioLowerVolume exec $ipc volume-down
bindsym --locked XF86AudioMute        exec $ipc volume-mute
bindsym --locked XF86AudioMicMute     exec $ipc mic-mute

# Hardware Screen Brightness Controls
bindsym --locked XF86MonBrightnessUp   exec $ipc brightness-up
bindsym --locked XF86MonBrightnessDown exec $ipc brightness-down

# =========================================================================
# Noctalia Native Screenshot Ecosystem
# =========================================================================
# Print Screen: Opens Noctalia's interactive area & window utility with drawing tools
bindsym Print exec noctalia msg screenshot-region

# Mod + Print Screen: Instantly captures the entire screen & saves to file
bindsym $mod+Print exec noctalia msg screenshot-fullscreen

# =========================================================================
# wf-recorder with Noctalia Notifications
# =========================================================================

# --- Fullscreen Recording ---
bindsym $mod+r exec --no-startup-id pgrep wf-recorder && (killall -s SIGINT wf-recorder && notify-send "Screen Recorder" "Recording saved to Videos/Screen Recording/") || (wf-recorder --audio=alsa_output.pci-0000_03_00.6.analog-stereo.monitor -c libx264 -p crf=18 -p preset=fast -f ~/Videos/Screen\ Recording/recording-full-$(date +'%Y%m%d-%H%M%S').mkv & notify-send "Screen Recorder" "Fullscreen recording started...")

# --- Regional Recording (Selected Area via Slurp) ---
bindsym $mod+Ctrl+r exec --no-startup-id pgrep wf-recorder && (killall -s SIGINT wf-recorder && notify-send "Screen Recorder" "Recording saved to Videos/Screen Recording/") || (wf-recorder --audio=alsa_output.pci-0000_03_00.6.analog-stereo.monitor -g "$(slurp)" -c libx264 -p crf=18 -p preset=fast -f ~/Videos/Screen\ Recording/recording-region-$(date +'%Y%m%d-%H%M%S').mkv & notify-send "Screen Recorder" "Regional recording started...")
