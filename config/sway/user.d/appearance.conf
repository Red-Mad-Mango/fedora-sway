# =========================================================================
# Window Gaps & Borders
# =========================================================================
gaps inner 8px
gaps outer 8px

default_border pixel 2px
default_floating_border pixel 2px

# =========================================================================
# Mouse Cursor Theme
# =========================================================================
seat seat0 xcursor_theme Bibata-Original-Ice 14

#=========================================================================
# Fonts
#========================================================================
#font pango:IosevkaAile 11
font pango:Google Sans Flex 11
exec gsettings set org.gnome.desktop.interface font-name 'Google Sans Flex 12'
exec gsettings set org.gnome.desktop.interface document-font-name 'Google Sans Flex 12'
#exec gsettings set org.gnome.desktop.interface monospace-font-name 'Iosevka 12'

#=========================================================================
# Icon
#========================================================================
set $icon_theme Papirus
exec_always gsettings set org.gnome.desktop.interface icon-theme 'Papirus'

# =========================================================================
# Window Borders & Client Color Theme
# =========================================================================
# name                    border  bg      text    ind     child_border
client.focused            #ef944d #141514 #f4decd #ef944d #ef944d
client.focused_inactive   #1e1f1e #141514 #f4decd #1e1f1e #1e1f1e
client.unfocused          #1e1f1e #141514 #f4decd #1e1f1e #1e1f1e
client.urgent             #f16e65 #141514 #f4decd #f16e65 #f16e65
client.placeholder        #1e1f1e #141514 #f4decd #1e1f1e #1e1f1e

# =========================================================================
# SwayFX Specific Enhancements (Uncomment if using swayfx package)
# =========================================================================
# blur enable
# corner_radius 6
# shadows enable
